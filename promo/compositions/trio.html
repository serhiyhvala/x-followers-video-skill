<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: var(--color-ground, #ffffff);
      font-family: Inter, sans-serif;
    }
    .tr-film {
      position: absolute;
      inset: 0;
    }
    .tr-film video { display: block; position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
    /* One word in a ground-coloured band at the bottom left, never over the film's own type. */
    .tr-tag {
      position: absolute;
      z-index: 2;
      left: 80px;
      bottom: 64px;
      padding: 16px 30px;
      border-radius: 18px;
      background: var(--color-ink, #0b0b0c);
      color: #ffffff;
      font-weight: 800;
      font-size: 40px;
      letter-spacing: -0.02em;
      line-height: 1;
      white-space: nowrap;
    }
    .tr-tag b { color: var(--color-accent, #ff5a1f); font-weight: 800; }
  </style>

  <div id="root" data-composition-id="trio" data-width="1920" data-height="1080">
    <div class="tr-film" id="tr-mosaic" data-layout-allow-overflow>
      <video id="tr-v1" class="clip" src="assets/clips/mosaic.mp4" muted playsinline data-start="0" data-duration="1.35" data-media-start="10.15"></video>
      <p class="tr-tag clip" id="tag-1" data-start="0" data-duration="1.35">mosaic</p>
    </div>
    <div class="tr-film" id="tr-receipt" data-layout-allow-overflow>
      <video id="tr-v2" class="clip" src="assets/clips/receipt.mp4" muted playsinline data-start="1.35" data-duration="1.35" data-media-start="15.6"></video>
      <p class="tr-tag clip" id="tag-2" data-start="1.35" data-duration="1.35">receipt</p>
    </div>
    <div class="tr-film" id="tr-terminal" data-layout-allow-overflow>
      <video id="tr-v3" class="clip" src="assets/clips/terminal.mp4" muted playsinline data-start="2.7" data-duration="1.3" data-media-start="11.4"></video>
      <p class="tr-tag clip" id="tag-3" data-start="2.7" data-duration="1.3">terminal</p>
    </div>
  </div>

  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      // Each tag slides in from the left edge as its film cuts in; the cut itself is hard, on the previous film's punch.
      const tagIn = (id, at) => tl.fromTo(id, { x: -60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: "expo.out" }, at);
      tagIn("#tag-1", 0.05);
      tagIn("#tag-2", 1.4);
      tagIn("#tag-3", 2.75);
      // A 1.04 punch-in on every cut so the three read as one rhythm.
      ["#tr-mosaic video", "#tr-receipt video", "#tr-terminal video"].forEach((sel, i) => {
        tl.fromTo(sel, { scale: 1.06 }, { scale: 1, duration: 1.3, ease: "power2.out", transformOrigin: "50% 50%" }, i * 1.35);
      });
      window.__timelines["trio"] = tl;
    })();
  </script>
</template>
