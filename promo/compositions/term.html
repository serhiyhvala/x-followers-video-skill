  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const lines = Array.from(document.querySelectorAll("#tm-out .tl"));
      const CH = 30 * 0.6;
      lines.forEach((el, i) => { if (i > 0) gsap.set(el, { autoAlpha: 0 }); });
      gsap.set("#tm-shot", { x: 900, opacity: 0 });
      gsap.set("#tm-shot-label", { opacity: 0 });

      // Typing: width in steps of one character; the cursor rides the right edge and hides when output starts.
      const type = (i, at) => {
        const cmd = lines[i].querySelector("[data-cmd]");
        const n = (cmd.textContent || "").length;
        gsap.set(cmd, { width: 0 });
        tl.set(lines[i], { autoAlpha: 1 }, at);
        tl.to(cmd, { width: Math.ceil(n * CH), duration: Math.max(0.3, n * 0.03), ease: `steps(${n})` }, at);
        return at + Math.max(0.3, n * 0.03) + 0.35; // Enter
      };
      const show = (i, at) => {
        tl.set(lines[i], { autoAlpha: 1 }, at);
        const prevCur = lines[i - 1] && lines[i - 1].querySelector(".cur");
        if (prevCur) tl.set(prevCur, { autoAlpha: 0 }, at);
      };

      // The window arrives on the drop from the reveal scene.
      tl.fromTo("#tm-win", { scale: 1.06, opacity: 0, filter: "blur(10px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, 0);

      // 1. install (the first command is already typed at frame 0; Enter at 0.55)
      let t = 0.55;
      show(1, t); show(2, t + 0.25); show(3, t + 0.9);
      // 2. collect: the followers page slides in beside a narrower window
      t = type(4, 2.2);
      tl.to("#tm-win", { width: 980, duration: 0.5, ease: "expo.out" }, 2.2);
      tl.to("#tm-shot", { x: 0, opacity: 1, duration: 0.6, ease: "expo.out" }, 2.4);
      tl.fromTo("#tm-shot-label", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 2.9);
      tl.fromTo("#tm-scan", { y: 0 }, { y: 360, duration: 1.6, ease: "steps(7)" }, 3.0);
      show(5, t + 0.3); show(6, t + 1.0); show(7, t + 1.7);
      // 3. build: the page leaves, the window widens again
      tl.to("#tm-shot", { x: 900, opacity: 0, duration: 0.35, ease: "power3.in" }, 6.3);
      tl.to("#tm-shot-label", { opacity: 0, duration: 0.2 }, 6.3);
      tl.to("#tm-win", { width: 1680, duration: 0.5, ease: "expo.out" }, 6.55);
      t = type(8, 6.9);
      show(9, t); show(10, t + 0.15);
      // 4. render: a progress bar fills, the file name lands
      t = type(11, t + 0.9);
      show(12, t);
      const pct = { n: 0 };
      const pctEl = document.getElementById("tm-pct");
      tl.fromTo("#tm-fill", { scaleX: 0 }, { scaleX: 1, duration: 1.4, ease: "power1.inOut" }, t);
      tl.fromTo(pct, { n: 0 }, { n: 100, duration: 1.4, ease: "power1.inOut", onUpdate: () => (pctEl.textContent = Math.round(pct.n) + "%") }, t);
      show(13, t + 1.5); show(14, t + 1.7);
      tl.fromTo("#tm-file", { color: "#79c0ff" }, { color: "#ffffff", duration: 0.2, ease: "power2.out" }, t + 2.3);

      window.__timelines["term"] = tl;
    })();
  </script>
