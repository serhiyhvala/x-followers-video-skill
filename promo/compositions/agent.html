    <svg id="ag-cursor" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3l14 8.5-6.2 1.6L9 20z" fill="#0b0b0c" stroke="#fff" stroke-width="1.4" stroke-linejoin="round" /></svg>

  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const CH = 30 * 0.62; // Inter 500 at 30 px averages about 0.62 em a character
      const typed = document.getElementById("ag-typed");
      const n = typed.textContent.length;
      gsap.set(typed, { width: 0 });
      gsap.set("#ag-ph", { autoAlpha: 1 });
      gsap.set("#ag-cursor", { x: 1830, y: 990, autoAlpha: 0 });

      // The window arrives on the drop from the reveal scene.
      tl.fromTo("#ag-win", { scale: 1.06, opacity: 0, filter: "blur(10px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out", transformOrigin: "50% 50%" }, 0);

      // 1. You type one message (frame 0 already shows the composer with the first words) and send it.
      tl.set("#ag-ph", { autoAlpha: 0 }, 0);
      tl.fromTo(typed, { width: 8 * CH }, { width: Math.ceil(n * CH) + 6, duration: 1.3, ease: `steps(${n - 8})` }, 0.1);
      tl.to("#ag-cursor", { autoAlpha: 1, duration: 0.05 }, 1.1);
      tl.to("#ag-cursor", { x: 1592, y: 968, duration: 0.5, ease: "power3.out" }, 1.1);
      tl.to("#ag-cursor", { scale: 0.86, duration: 0.07, yoyo: true, repeat: 1, transformOrigin: "20% 15%" }, 1.65);
      tl.to("#ag-send", { scale: 0.9, duration: 0.07, yoyo: true, repeat: 1 }, 1.65);
      tl.to(typed, { width: 0, duration: 0.01 }, 1.75);
      tl.set("#ag-ph", { autoAlpha: 1 }, 1.76);
      tl.fromTo("#ag-user", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 1.75);
      tl.fromTo("#ag-bubble", { y: 700, scale: 0.6 }, { y: 0, scale: 1, duration: 0.55, ease: "expo.out" }, 1.75);
      tl.to("#ag-cursor", { x: 1830, y: 990, duration: 0.4, ease: "power3.in" }, 1.9);
      tl.to("#ag-cursor", { autoAlpha: 0, duration: 0.05 }, 2.3);

      // 2. The agent answers and runs the steps itself; each command types under its step, then the check lands.
      const spin = (id, at, until) => tl.fromTo(id + " .spin", { rotation: 0 }, { rotation: 360 * Math.max(1, Math.round((until - at) / 0.8)), duration: until - at, ease: "none", transformOrigin: "50% 50%" }, at);
      const step = (id, at, cmdDur, until) => {
        tl.fromTo(id, { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.3, ease: "expo.out" }, at);
        const cmd = document.querySelector(id + " [data-cmd]");
        if (cmd) {
          const k = cmd.textContent.length;
          gsap.set(cmd, { width: 0, paddingLeft: 0, paddingRight: 0 });
          tl.to(cmd, { width: Math.ceil(k * 28 * 0.6) + 28, paddingLeft: 14, paddingRight: 14, duration: cmdDur, ease: `steps(${k})` }, at + 0.25);
        }
        spin(id, at, until);
        tl.to(id + " .spin", { opacity: 0, duration: 0.1 }, until);
        tl.fromTo(id + " .ok", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.8)", transformOrigin: "50% 50%" }, until);
        tl.fromTo(id + " .done", { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, until + 0.1);
      };
      tl.fromTo("#ag-a0", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out" }, 2.4);
      step("#ag-s1", 2.8, 0.9, 4.1);
      step("#ag-s2", 4.4, 0, 7.6);
      tl.fromTo("#ag-shot", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, 4.7);
      tl.fromTo("#ag-shot-cap", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 5.0);
      tl.fromTo("#ag-scan", { y: 0 }, { y: 270, duration: 2.4, ease: "steps(7)" }, 4.9);
      // The thread scrolls up by whole rows so the newest step stays in view.
      tl.to("#ag-scroll", { y: -420, duration: 0.45, ease: "power2.inOut" }, 8.6);
      step("#ag-s3", 8.8, 1.1, 10.3);
      step("#ag-s4", 10.6, 0, 12.4);
      tl.fromTo("#ag-fill", { scaleX: 0 }, { scaleX: 1, duration: 1.6, ease: "power1.inOut" }, 10.7);
      // 3. The file lands as an attachment; the agent signs off; the cursor goes for the card.
      tl.fromTo("#ag-card", { opacity: 0, y: 24, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "expo.out", transformOrigin: "0% 0%" }, 12.6);
      tl.fromTo("#ag-card-cap", { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, 12.75);
      tl.fromTo("#ag-done", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out" }, 13.1);
      tl.to("#ag-cursor", { autoAlpha: 1, duration: 0.05 }, 14.0);
      tl.to("#ag-cursor", { x: 470, y: 660, duration: 0.6, ease: "power3.out" }, 14.0);
      tl.to("#ag-cursor", { scale: 0.86, duration: 0.06, yoyo: true, repeat: 1, transformOrigin: "20% 15%" }, 14.45);
      tl.to("#ag-card", { scale: 0.96, duration: 0.06, yoyo: true, repeat: 1, transformOrigin: "50% 50%" }, 14.45);

      window.__timelines["agent"] = tl;
    })();
  </script>
