<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: var(--color-ground, #ffd43b);
      color: var(--color-ink, #111111);
      font-family: "Archivo Black", Inter, sans-serif;
    }
    #stats-stage {
      position: absolute;
      inset: 0;
    }
    #ms-copy {
      position: absolute;
      left: 140px;
      top: 300px;
      width: 760px;
    }
    #ms-label {
      font-family: Inter, sans-serif;
      font-weight: 700;
      font-size: 44px;
      letter-spacing: -0.02em;
      line-height: 1.1;
      white-space: nowrap;
    }
    #ms-num {
      margin-top: 18px;
      font-size: 200px;
      line-height: 1;
      letter-spacing: -0.01em;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    #ms-sub {
      margin-top: 22px;
      font-family: Inter, sans-serif;
      font-weight: 600;
      font-size: 38px;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }
    #ms-source {
      position: absolute;
      left: 140px;
      top: 930px;
      font-family: Inter, sans-serif;
      font-weight: 500;
      font-size: 28px;
      color: rgba(17, 17, 17, 0.62);
      white-space: nowrap;
    }
    #ms-bars {
      position: absolute;
      left: 1010px;
      top: 260px;
      width: {{barsW}}px;
      height: {{barsH}}px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    .bar {
      width: {{barTile}}px;
      flex: none;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .bar-stack {
      display: flex;
      flex-direction: column-reverse;
      gap: 10px;
    }
    .bt {
      width: {{barTile}}px;
      height: {{barTile}}px;
      border-radius: {{barTileRadius}}px;
      background: var(--color-ink, #111111);
      box-shadow: 0 6px 14px -6px rgba(0, 0, 0, 0.35);
    }
    .bt.peak {
      background: var(--color-paper, #ffffff);
    }
    .bar-day {
      position: absolute;
      top: {{barsH}}px;
      margin-top: 18px;
      font-family: Inter, sans-serif;
      font-weight: 600;
      font-size: 28px;
      white-space: nowrap;
    }
    .v #ms-copy { left: 80px; top: 230px; width: 920px; }
    .v #ms-num { font-size: 190px; }
    .v #ms-bars { left: 195px; top: 640px; }
    .v #ms-source { left: 80px; top: 1300px; }
  </style>

  <div id="root" data-composition-id="stats" data-width="{{W}}" data-height="{{H}}">
    <div id="stats-stage" class="{{rootClass}}">
      <div id="ms-copy">
        <p id="ms-label">Impressions · last 7 days</p>
        <p id="ms-num">0</p>
        <p id="ms-sub"></p>
      </div>
      <div id="ms-bars" data-layout-allow-overflow>
{{barsMarkup}}
      </div>
      <p id="ms-source">{{sourceLine}}</p>
    </div>
  </div>

  <script>
    (function () {
      const A = {{analyticsJson}};
      const BARS = {{barsJson}};
      const HAS_GROWTH = {{hasGrowth}};
      const sum = (a) => a.reduce((x, y) => x + y, 0);
      const short = (n) =>
        n >= 1e6 ? (Math.floor(n / 1e5) / 10).toFixed(1).replace(/\.0$/, "") + "M"
        : n >= 1000 ? (Math.floor(n / 100) / 10).toFixed(1).replace(/\.0$/, "") + "K"
        : String(Math.round(n));
      const tl = gsap.timeline({ paused: true });
      const num = document.getElementById("ms-num");
      const label = document.getElementById("ms-label");
      const sub = document.getElementById("ms-sub");
      const counter = (fmt, to, at, dur) => {
        const o = { n: 0 };
        tl.fromTo(o, { n: 0 }, { n: to, duration: dur, ease: "power2.out", onUpdate: () => (num.textContent = fmt(o.n)) }, at);
      };
      const tileAt = (i, j) => document.getElementById(`bt-${i}-${j}`);
      const stack = (heights, peak, at) => {
        heights.forEach((h, i) => {
          for (let j = 0; j < 6; j++) {
            const el = tileAt(i, j);
            el.classList.toggle("peak", i === peak);
            if (j < h) tl.fromTo(el, { scale: 0, opacity: 1 }, { scale: 1, duration: 0.4, ease: "back.out(1.5)" }, at + i * 0.05 + j * 0.05);
          }
        });
      };

      // Frame 0: no tile is up yet; the columns stack in after the copy lands.
      gsap.set(".bt", { scale: 0 });
      // A: impressions rise from below as the previous scene leaves upward.
      tl.fromTo("#ms-copy", { y: 900, filter: "blur(14px)" }, { y: 0, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, 0);
      tl.fromTo("#ms-source", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.5);
      counter(short, sum(A.impressions), 0.15, 1.3);
      sub.textContent = A.impressionsChangePct == null ? "" : (A.impressionsChangePct >= 0 ? "↑ " : "↓ ") + Math.abs(A.impressionsChangePct) + "% vs the week before";
      tl.fromTo("#ms-sub", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.6);
      tl.fromTo(".bar-day", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out", stagger: 0.04 }, 0.3);
      stack(BARS.a, BARS.peakA, 0.2);

      if (!HAS_GROWTH) {
        tl.to("#stats-stage", { y: -1400, filter: "blur(12px)", duration: 0.3, ease: "power3.in" }, 2.1);
        window.__timelines["stats"] = tl;
        return;
      }

      // B: the same columns restack to new followers; the copy swaps on a blur.
      const net = sum(A.follows) - sum(A.unfollows);
      const swapAt = 2.2;
      tl.to("#ms-copy", { opacity: 0, filter: "blur(8px)", duration: 0.16, ease: "power3.in" }, swapAt);
      tl.add(() => {
        label.textContent = "New followers · this week";
        sub.textContent = sum(A.follows) + " follows · " + sum(A.unfollows) + " unfollows";
      }, swapAt + 0.17);
      tl.add(() => {
        label.textContent = "Impressions · last 7 days";
        sub.textContent = A.impressionsChangePct == null ? "" : (A.impressionsChangePct >= 0 ? "↑ " : "↓ ") + Math.abs(A.impressionsChangePct) + "% vs the week before";
      }, swapAt + 0.169);
      tl.to("#ms-copy", { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, swapAt + 0.18);
      counter((x) => (net >= 0 ? "+" : "−") + Math.abs(Math.round(x)), net, swapAt + 0.2, 1.1);
      BARS.a.forEach((h, i) => {
        for (let j = 0; j < 6; j++) if (j < h) tl.to(tileAt(i, j), { scale: 0, duration: 0.18, ease: "power3.in" }, swapAt + j * 0.02);
      });
      tl.add(() => BARS.b.forEach((h, i) => { for (let j = 0; j < 6; j++) tileAt(i, j).classList.toggle("peak", i === BARS.peakB); }), swapAt + 0.3);
      tl.add(() => BARS.a.forEach((h, i) => { for (let j = 0; j < 6; j++) tileAt(i, j).classList.toggle("peak", i === BARS.peakA); }), swapAt + 0.299);
      BARS.b.forEach((h, i) => {
        for (let j = 0; j < 6; j++) {
          if (j < h) tl.fromTo(tileAt(i, j), { scale: 0 }, { scale: 1, duration: 0.4, ease: "back.out(1.5)" }, swapAt + 0.32 + i * 0.05 + j * 0.05);
        }
      });

      // Exit upward; the finale's tiles converge from the edges.
      tl.to("#stats-stage", { y: -1400, filter: "blur(12px)", duration: 0.3, ease: "power3.in" }, 4.1);
      window.__timelines["stats"] = tl;
    })();
  </script>
</template>
