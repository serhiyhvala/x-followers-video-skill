<!doctype html>
<html lang="en" data-composition-variables='{{rootVariables}}'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width={{W}}, height={{H}}" />
    <script src="{{gsap}}"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: {{W}}px; height: {{H}}px; overflow: hidden; background: var(--color-ground); }
      #ground { position: absolute; inset: 0; background: var(--color-ground); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{duration}}" data-width="{{W}}" data-height="{{H}}" data-fps="{{fps}}" data-motion-blur="on">
      <div id="ground"></div>
{{scenes}}
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
